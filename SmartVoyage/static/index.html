<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartVoyage 旅行智能助手</title>
<style>
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --border: #e3e8ef;
    --primary: #185fa5;
    --primary-soft: #e6f1fb;
    --text: #1f2937;
    --muted: #6b7280;
    --teal: #0f6e56;
    --teal-soft: #e1f5ee;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--primary-soft);
    border: 1px solid #b5d4f4; display: grid; place-items: center; color: var(--primary); font-weight: 600; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .controls { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
  .badge { padding: 5px 11px; border-radius: 999px; background: var(--teal-soft); color: var(--teal); font-size: 12px; }
  .switch { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 20px;
    max-width: 1240px; margin: 22px auto; padding: 0 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
  .chat { display: flex; flex-direction: column; height: calc(100vh - 130px); min-height: 520px; }
  .chat-head { padding: 14px 20px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 14px;
    display: flex; justify-content: space-between; align-items: center; }
  .chat-head small { font-weight: 400; color: var(--muted); }
  #messages { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 84%; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--primary); color: #fff; padding: 11px 15px; border-radius: 13px 13px 4px 13px; }
  .msg.bot { align-self: flex-start; background: #f3f6fa; border: 1px solid var(--border);
    padding: 11px 15px; border-radius: 13px 13px 13px 4px; }
  .route { font-size: 11px; color: var(--teal); margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 7px; }
  .input-area { border-top: 1px solid var(--border); padding: 14px 18px; }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 11px; }
  .example { font-size: 12px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 999px;
    background: #fafbfc; cursor: pointer; color: var(--muted); }
  .example:hover { border-color: var(--primary); color: var(--primary); }
  .input-row { display: flex; gap: 10px; }
  input[type=text] { flex: 1; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 14px; outline: none; font-family: inherit; }
  input[type=text]:focus { border-color: var(--primary); }
  button.primary { background: var(--primary); color: #fff; border: none; border-radius: 10px;
    padding: 0 22px; cursor: pointer; font-size: 14px; font-family: inherit; }
  button.primary:disabled { opacity: .55; cursor: not-allowed; }
  .side { display: flex; flex-direction: column; gap: 16px; }
  .panel { padding: 17px 18px; }
  .panel h2 { font-size: 13px; margin: 0 0 13px; font-weight: 600; }
  .agent { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .agent:last-child { margin-bottom: 0; }
  .agent-name { font-weight: 600; font-size: 13px; color: var(--primary); }
  .agent-desc { color: var(--muted); font-size: 12px; line-height: 1.6; margin-top: 6px; }
  .agent-url { font-size: 11px; color: var(--muted); margin-top: 6px; font-family: Consolas, monospace; }
  .stat { display: flex; justify-content: space-between; font-size: 12px; padding: 5px 0; color: var(--muted); }
  .stat b { color: var(--text); font-weight: 500; }
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .ghost { flex: 1; padding: 8px 6px; font-size: 12px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; cursor: pointer; color: var(--text); font-family: inherit; }
  .ghost:hover { border-color: var(--primary); color: var(--primary); }
  .profile-row { display: flex; gap: 8px; }
  select { flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-family: inherit; }
  #notice { font-size: 12px; color: var(--teal); margin-top: 10px; min-height: 16px; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 8px 0 24px; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .chat { height: 68vh; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">SV</div>
    <div>
      <h1>基于 A2A 的 SmartVoyage 旅行智能助手</h1>
      <div class="sub">输入自然语言，系统自动识别意图、路由子代理并返回一站式旅行方案</div>
    </div>
  </div>
  <div class="controls">
    <span class="badge" id="status-badge">服务连接中</span>
    <label class="switch"><input type="checkbox" id="stream-toggle" checked> 流式输出</label>
  </div>
</header>

<div class="layout">
  <section class="card chat">
    <div class="chat-head"><span>对话</span><small>Planning + ReAct · MCP + A2A</small></div>
    <div id="messages"></div>
    <div class="input-area">
      <div class="examples" id="examples"></div>
      <div class="input-row">
        <input type="text" id="query" placeholder="例如：北京 2025-08-11 的天气怎么样，适合出行吗" autocomplete="off">
        <button class="primary" id="send">发送</button>
      </div>
    </div>
  </section>

  <aside class="side">
    <div class="card panel">
      <h2>AgentCard · 子代理</h2>
      <div id="agents"><div class="agent-desc">正在获取代理卡片…</div></div>
    </div>
    <div class="card panel">
      <h2>记忆状态</h2>
      <div id="memory">
        <div class="stat"><span>短期对话</span><b>-</b></div>
        <div class="stat"><span>用户偏好</span><b>-</b></div>
      </div>
      <div class="btn-row">
        <button class="ghost" id="refresh-memory">刷新记忆</button>
        <button class="ghost" id="clear-memory">清空记忆</button>
      </div>
      <div class="profile-row" style="margin-top:12px">
        <select id="profile-select">
          <option value="二等座">偏好：二等座</option>
          <option value="商务座">偏好：商务座</option>
          <option value="经济舱">偏好：经济舱</option>
          <option value="SUV">偏好：SUV 租车</option>
        </select>
        <button class="ghost" id="save-profile" style="flex:0 0 68px">保存</button>
      </div>
      <div id="notice"></div>
    </div>
  </aside>
</div>
<footer>Powered by SmartVoyage | 基于 Agent2Agent + MCP 的旅行助手系统 v1.0</footer>

<script>
const messages = document.getElementById('messages');
const queryInput = document.getElementById('query');
const sendBtn = document.getElementById('send');
const notice = document.getElementById('notice');
const examples = [
  '北京 2025-08-11 的天气怎么样，适合出行吗',
  '查询北京到上海 2025-07-30 的二等座火车票',
  '北京到成都 2026-05-01 的机票',
  '成都 2026-05-01 租车和综合型保险',
  '想看雪山的地方',
  '成都有什么好玩的景点'
];

function addMessage(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;
  return el;
}

function setRoute(el, agents) {
  if (!agents || !agents.length) return;
  const route = document.createElement('div');
  route.className = 'route';
  route.textContent = '路由至：' + agents.join(' / ');
  el.appendChild(document.createElement('br'));
  el.appendChild(route);
}

function setBusy(busy) {
  sendBtn.disabled = busy;
  sendBtn.textContent = busy ? '处理中' : '发送';
}

examples.forEach(text => {
  const btn = document.createElement('button');
  btn.className = 'example';
  btn.textContent = text;
  btn.onclick = () => { queryInput.value = text; queryInput.focus(); };
  document.getElementById('examples').appendChild(btn);
});

async function sendNormal(text, botEl) {
  const res = await fetch('/api/chat', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({message: text})
  });
  const data = await res.json();
  botEl.textContent = data.message || '（无回复）';
  setRoute(botEl, data.agents);
  messages.scrollTop = messages.scrollHeight;
}

async function sendStream(text, botEl) {
  const res = await fetch('/api/chat/stream', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({message: text})
  });
  if (!res.ok || !res.body) { await sendNormal(text, botEl); return; }
  const reader = res.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buffer = '', content = '';
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, {stream: true});
    const frames = buffer.split('\n\n');
    buffer = frames.pop() || '';
    for (const frame of frames) {
      const line = frame.split('\n').find(l => l.startsWith('data: '));
      if (!line) continue;
      let evt;
      try { evt = JSON.parse(line.slice(6)); } catch (e) { continue; }
      if (evt.type === 'delta') {
        content += evt.content;
        botEl.textContent = content;
        messages.scrollTop = messages.scrollHeight;
      } else if (evt.type === 'done') {
        botEl.textContent = evt.content || content;
        setRoute(botEl, evt.agents);
      } else if (evt.type === 'error') {
        botEl.textContent += '\n' + evt.content;
      }
    }
  }
}

async function send() {
  const text = queryInput.value.trim();
  if (!text || sendBtn.disabled) return;
  queryInput.value = '';
  addMessage('user', text);
  const botEl = addMessage('bot', '正在查询…');
  setBusy(true);
  try {
    if (document.getElementById('stream-toggle').checked) {
      await sendStream(text, botEl);
    } else {
      await sendNormal(text, botEl);
    }
    refreshMemory();
  } catch (err) {
    botEl.textContent = '请求失败：' + err.message + '（请确认 API 与 A2A/MCP 服务已启动）';
  } finally {
    setBusy(false);
    queryInput.focus();
  }
}

async function loadAgents() {
  try {
    const res = await fetch('/api/agents');
    const data = await res.json();
    const box = document.getElementById('agents');
    box.textContent = '';
    (data.data || []).forEach(card => {
      const item = document.createElement('div');
      item.className = 'agent';
      const name = document.createElement('div');
      name.className = 'agent-name';
      name.textContent = 'Agent: ' + (card.name || '未命名');
      const desc = document.createElement('div');
      desc.className = 'agent-desc';
      desc.textContent = card.description || 'A2A 子代理';
      const url = document.createElement('div');
      url.className = 'agent-url';
      url.textContent = card.url || '';
      item.append(name, desc, url);
      box.appendChild(item);
    });
    document.getElementById('status-badge').textContent = '服务已连接';
  } catch (e) {
    document.getElementById('status-badge').textContent = '服务未连接';
  }
}

async function refreshMemory() {
  try {
    const res = await fetch('/api/memory');
    const data = await res.json();
    const state = data.data || {};
    const box = document.getElementById('memory');
    box.textContent = '';
    const rows = [
      ['短期对话', (state.short_term_messages || []).length + ' 条'],
      ['用户偏好', Object.keys(state.user_profile || {}).length + ' 项'],
      ['实体历史', (state.entity_history || []).length + ' 条'],
      ['累计消息', (state.messages_count || 0) + ' 条']
    ];
    rows.forEach(([label, value]) => {
      const row = document.createElement('div');
      row.className = 'stat';
      const left = document.createElement('span');
      left.textContent = label;
      const right = document.createElement('b');
      right.textContent = value;
      row.append(left, right);
      box.appendChild(row);
    });
  } catch (e) { /* 记忆面板非关键路径 */ }
}

sendBtn.onclick = send;
queryInput.onkeydown = e => { if (e.key === 'Enter') send(); };
document.getElementById('refresh-memory').onclick = refreshMemory;
document.getElementById('clear-memory').onclick = async () => {
  await fetch('/api/memory/clear', {method: 'POST'});
  notice.textContent = '记忆已清空';
  refreshMemory();
};
document.getElementById('save-profile').onclick = async () => {
  const value = document.getElementById('profile-select').value;
  await fetch('/api/memory/profile', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({profile: {'座位喜好': value}})
  });
  notice.textContent = '偏好已保存：' + value;
  refreshMemory();
};

addMessage('bot', '欢迎使用 SmartVoyage！可以问我天气、火车票/机票/演唱会票、租车、保险、旅游团或景点推荐。');
loadAgents();
refreshMemory();
</script>
</body>
</html>
